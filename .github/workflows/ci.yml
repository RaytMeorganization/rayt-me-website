name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22.15
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:bot
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://raytme.me
          NEXT_PUBLIC_API_URL: https://api.raytme.me
          NEXT_PUBLIC_WEB_SIGN_UP_DISABLED: "true"

name: Deploy website

# Single path to production: push to main -> CI (lint, typecheck, build) -> Deploy.
# Deploy runs only after CI succeeds on main, so a red CI can never go live.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # rayt-me-shared lives only on the VPS workspace (no public GitHub repo).
      # Sync website sources, then rebuild the web image on the server.
      - name: Sync website to VPS and rebuild
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude .env.production \
            -e 'ssh -i ~/.ssh/vps -o IdentitiesOnly=yes' \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/rayt-me/rayt-me-website/"
          ssh -i ~/.ssh/vps -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
            'cd /opt/rayt-me/deploy && unset WEB_IMAGE API_IMAGE && ./remote-deploy.sh web'
